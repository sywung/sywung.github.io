<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Timer APK Download</title>
<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  line-height: 1.6;
}
.container {
  max-width: 760px;
  margin: auto;
  padding: 40px 20px;
}
h1 {
  margin: 0 0 12px;
  font-size: 34px;
}
p {
  margin: 0 0 16px;
}
.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 12px;
  margin-top: 18px;
  transition: 0.3s;
}
.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}
a {
  color: #38bdf8;
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
}
.muted {
  color: #94a3b8;
  font-size: 14px;
}
.version {
  font-size: 22px;
  font-weight: 600;
  margin: 0 0 4px;
}
.notes {
  margin: 12px 0 0;
  padding-left: 20px;
}
</style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZS31KPH66P"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());

    gtag("config", "G-ZS31KPH66P");
  </script>
</head>
<body>
<div class="container">
  <h1>Classroom Timer APK Download</h1>
  <p class="muted">請依裝置架構下載對應版本。</p>

  <div class="card" id="release" hidden>
    <h2>最新版本</h2>
    <p class="version" id="release-version"></p>
    <p class="muted" id="release-date"></p>
    <ul class="notes" id="release-notes"></ul>
  </div>

  <div class="card">
    <h2>arm32 / armeabi-v7a</h2>
    <p>
      <a href="./classroom-timer-tv-arm32.apk">classroom-timer-tv-arm32.apk</a>
    </p>
  </div>

  <div class="card">
    <h2>arm64 / arm64-v8a</h2>
    <p>
      <a href="./classroom-timer-tv-arm64.apk">classroom-timer-tv-arm64.apk</a>
    </p>
  </div>
</div>
<script>
// 版本資訊由 build.sh 產生（classroom-timer-tv.json），與 APK 一起發佈
fetch("./classroom-timer-tv.json?t=" + Date.now())
  .then(function (res) { return res.ok ? res.json() : Promise.reject(res.status); })
  .then(function (info) {
    var b = String(info.build || "");
    document.getElementById("release-version").textContent =
      "v" + (info.version || "?");
    if (/^\d{12}$/.test(b)) {
      document.getElementById("release-date").textContent =
        "發佈於 " + b.slice(0, 4) + "-" + b.slice(4, 6) + "-" + b.slice(6, 8) +
        " " + b.slice(8, 10) + ":" + b.slice(10, 12) + "（build " + b + "）";
    }
    var list = document.getElementById("release-notes");
    (info.notes || []).forEach(function (note) {
      var li = document.createElement("li");
      li.textContent = note;
      list.appendChild(li);
    });
    document.getElementById("release").hidden = false;
  })
  .catch(function () { /* 讀不到版本資訊時只顯示下載連結 */ });
</script>
</body>
</html>
